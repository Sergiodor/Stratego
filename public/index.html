<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Stratego Online</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #1a1a2e;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    overflow-x: hidden;
  }
  #status-bar {
    width: 100%;
    text-align: center;
    padding: 10px 8px;
    font-size: 16px;
    font-weight: bold;
    background: #16213e;
    border-bottom: 2px solid #0f3460;
    min-height: 44px;
  }
  #main {
    display: flex;
    gap: 20px;
    margin-top: 15px;
    align-items: flex-start;
    padding: 0 10px;
    width: 100%;
    max-width: 760px;
    justify-content: center;
  }
  #board-container {
    position: relative;
    flex-shrink: 0;
  }
  canvas {
    border: 3px solid #0f3460;
    border-radius: 4px;
    cursor: pointer;
    display: block;
    width: 500px;
    height: 500px;
  }
  #sidebar {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 220px;
    min-width: 180px;
    flex-shrink: 1;
  }
  .panel {
    background: #16213e;
    border: 2px solid #0f3460;
    border-radius: 6px;
    padding: 10px;
  }
  .panel h3 {
    text-align: center;
    margin-bottom: 8px;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #figures-panel {
    max-height: 500px;
    overflow-y: auto;
  }
  #figures-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    justify-content: center;
  }
  .figure-btn {
    width: 48px;
    height: 48px;
    border: 2px solid #444;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: bold;
    transition: all 0.15s;
    position: relative;
    background: #1a1a2e;
    color: #eee;
    -webkit-tap-highlight-color: transparent;
  }
  .figure-btn:hover { border-color: #e94560; transform: scale(1.08); }
  .figure-btn.selected { border-color: #e94560; background: #e9456033; box-shadow: 0 0 10px #e94560aa; }
  .figure-btn.depleted { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
  .figure-btn .count {
    position: absolute;
    top: -4px;
    right: -4px;
    background: #e94560;
    color: white;
    border-radius: 50%;
    width: 18px;
    height: 18px;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .figure-btn .fig-label {
    font-size: 16px;
    line-height: 1;
  }
  .figure-btn .fig-name {
    font-size: 8px;
    margin-top: 1px;
  }
  .captured-list {
    font-size: 12px;
    max-height: 120px;
    overflow-y: auto;
  }
  .captured-list div {
    padding: 2px 4px;
    border-bottom: 1px solid #0f346044;
  }
  #btn-container {
    text-align: center;
  }
  .btn {
    padding: 10px 24px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-ready {
    background: #27ae60;
    color: white;
  }
  .btn-ready:hover { background: #2ecc71; }
  .btn-ready.active {
    background: #e94560;
  }
  .btn-ready.active:hover { background: #c0392b; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #combat-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  #combat-overlay.show { display: flex; }
  #combat-box {
    background: #16213e;
    border: 3px solid #e94560;
    border-radius: 12px;
    padding: 24px 20px;
    text-align: center;
    min-width: 280px;
    max-width: 90vw;
  }
  #combat-box h2 { margin-bottom: 15px; font-size: 20px; }
  .combat-figures {
    display: flex;
    gap: 20px;
    justify-content: center;
    align-items: center;
    margin: 15px 0;
  }
  .combat-fig {
    width: 70px;
    height: 70px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: bold;
    border: 3px solid #444;
  }
  .combat-fig.winner { border-color: #27ae60; box-shadow: 0 0 15px #27ae6088; }
  .combat-fig.loser { border-color: #e74c3c; opacity: 0.5; }
  .combat-fig.draw { border-color: #f39c12; opacity: 0.6; }
  .combat-vs { font-size: 24px; font-weight: bold; color: #e94560; }
  #combat-result-text { font-size: 16px; margin-top: 10px; }

  /* ---- Responsive ---- */
  @media (max-width: 760px) {
    #main {
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
      padding-bottom: 20px;
    }
    #board-container {
      width: 100%;
      max-width: 500px;
    }
    canvas {
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
    }
    #sidebar {
      width: 100%;
      max-width: 500px;
      flex-direction: column;
    }
    #figures-panel {
      max-height: none;
    }
    #figures-grid {
      gap: 6px;
    }
    .figure-btn {
      width: 44px;
      height: 44px;
    }
    .figure-btn .fig-label { font-size: 14px; }
    .figure-btn .fig-name { font-size: 7px; }
    .captured-list { max-height: 80px; }
    #status-bar { font-size: 14px; padding: 8px 6px; }
    .combat-fig { width: 60px; height: 60px; }
    .combat-figures { gap: 14px; }
    #combat-box { padding: 18px 14px; min-width: 240px; }
  }

  @media (max-width: 400px) {
    .figure-btn {
      width: 38px;
      height: 38px;
    }
    .figure-btn .fig-label { font-size: 13px; }
    .figure-btn .fig-name { display: none; }
    .figure-btn .count { width: 16px; height: 16px; font-size: 9px; }
    #status-bar { font-size: 12px; }
    .combat-fig { width: 50px; height: 50px; font-size: 12px; }
    #combat-result-text { font-size: 13px; }
  }
</style>
</head>
<body>

<div id="status-bar">Connecting...</div>

<div id="main">
  <div id="board-container">
    <canvas id="gameCanvas" width="500" height="500"></canvas>
  </div>
  <div id="sidebar">
    <div class="panel" id="figures-panel">
      <h3>Figures</h3>
      <div id="figures-grid"></div>
    </div>
    <div id="btn-container"></div>
    <div class="panel" id="captured-red-panel">
      <h3 style="color: OrangeRed;">Captured Red (<span id="captured-red-count">0</span>)</h3>
      <div class="captured-list" id="captured-red"></div>
    </div>
    <div class="panel" id="captured-blue-panel">
      <h3 style="color: MediumTurquoise;">Captured Blue (<span id="captured-blue-count">0</span>)</h3>
      <div class="captured-list" id="captured-blue"></div>
    </div>
  </div>
</div>

<div id="combat-overlay">
  <div id="combat-box">
    <h2>Combat!</h2>
    <div class="combat-figures">
      <div class="combat-fig" id="combat-attacker"></div>
      <div class="combat-vs">VS</div>
      <div class="combat-fig" id="combat-defender"></div>
    </div>
    <div id="combat-result-text"></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

const CELL = 50;
const COLORS = {
  red: 'OrangeRed',
  blue: 'MediumTurquoise',
  ground: '#229954',
  groundDark: '#1e8449',
  water: '#2980b9',
  highlight: 'rgba(212,244,201,0.5)',
  highlightAttack: 'rgba(231,76,60,0.4)',
  selected: 'rgba(241,196,15,0.4)',
};

const FIGURE_DEFS = {
  bomb:       { name: 'Bomb',       label: '\u{1F4A3}', rate: 100 },
  flag:       { name: 'Flag',       label: '\u{1F6A9}', rate: 0 },
  spy:        { name: 'Spy',        label: '1',  rate: 1 },
  scout:      { name: 'Scout',      label: '2',  rate: 2 },
  miner:      { name: 'Miner',      label: '3',  rate: 3 },
  sergeant:   { name: 'Sergeant',   label: '4',  rate: 4 },
  lieutenant: { name: 'Lieutenant', label: '5',  rate: 5 },
  captain:    { name: 'Captain',    label: '6',  rate: 6 },
  major:      { name: 'Major',      label: '7',  rate: 7 },
  colonel:    { name: 'Colonel',    label: '8',  rate: 8 },
  general:    { name: 'General',    label: '9',  rate: 9 },
  marshal:    { name: 'Marshal',    label: '10', rate: 10 },
};

const FIGURE_ORDER = ['flag','bomb','spy','scout','miner','sergeant','lieutenant','captain','major','colonel','general','marshal'];

const BOARD_SIZE = 500; // logical canvas resolution (10 * CELL)

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let state = null;       // latest game_state from server
let selectedFigure = null; // figure key selected from sidebar (placement)
let selectedCell = null;   // [row, col] selected on board (playing)
let allowedMoves = [];     // [[row,col], ...] for currently selected piece

// ============== DRAWING ==============

function drawBoard() {
  if (!state) return;
  ctx.clearRect(0, 0, BOARD_SIZE, BOARD_SIZE);

  for (let r = 0; r < 10; r++) {
    for (let c = 0; c < 10; c++) {
      const x = c * CELL;
      const y = r * CELL;
      const cell = state.board[r][c];

      // Ground
      if (cell.type === 'water') {
        ctx.fillStyle = COLORS.water;
        ctx.fillRect(x, y, CELL, CELL);
        // Wave pattern
        ctx.strokeStyle = '#3498db';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let w = 0; w < 3; w++) {
          const wy = y + 15 + w * 10;
          ctx.moveTo(x + 3, wy);
          ctx.quadraticCurveTo(x + 12, wy - 5, x + 25, wy);
          ctx.quadraticCurveTo(x + 37, wy + 5, x + 47, wy);
        }
        ctx.stroke();
      } else {
        // Checkerboard green
        ctx.fillStyle = (r + c) % 2 === 0 ? COLORS.ground : COLORS.groundDark;
        ctx.fillRect(x, y, CELL, CELL);
      }

      // Highlight placement area during placement phase
      if (state.phase === 'placement' && state.role === 'player' && cell.type !== 'water') {
        const placementRows = state.myColor === 'red' ? [6,7,8,9] : [0,1,2,3];
        if (placementRows.includes(r) && !cell.figure) {
          ctx.fillStyle = 'rgba(255,255,255,0.08)';
          ctx.fillRect(x, y, CELL, CELL);
        }
      }

      // Highlight selected cell
      if (selectedCell && selectedCell[0] === r && selectedCell[1] === c) {
        ctx.fillStyle = COLORS.selected;
        ctx.fillRect(x, y, CELL, CELL);
      }

      // Highlight allowed moves
      if (allowedMoves.some(([mr, mc]) => mr === r && mc === c)) {
        const targetHasFigure = cell.figure;
        ctx.fillStyle = targetHasFigure ? COLORS.highlightAttack : COLORS.highlight;
        ctx.fillRect(x, y, CELL, CELL);
        // Draw dot for empty, X for attack
        if (!targetHasFigure) {
          ctx.beginPath();
          ctx.arc(x + CELL/2, y + CELL/2, 6, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,0.4)';
          ctx.fill();
        }
      }

      // Draw figure
      if (cell.figure) {
        drawFigure(x, y, cell.figure);
      }

      // Grid line
      ctx.strokeStyle = 'rgba(0,0,0,0.15)';
      ctx.lineWidth = 0.5;
      ctx.strokeRect(x, y, CELL, CELL);
    }
  }
}

function drawFigure(x, y, figure) {
  const padding = 3;
  const w = CELL - padding * 2;
  const h = CELL - padding * 2;
  const fx = x + padding;
  const fy = y + padding;
  const radius = 5;

  // Rounded rect
  ctx.beginPath();
  ctx.moveTo(fx + radius, fy);
  ctx.lineTo(fx + w - radius, fy);
  ctx.quadraticCurveTo(fx + w, fy, fx + w, fy + radius);
  ctx.lineTo(fx + w, fy + h - radius);
  ctx.quadraticCurveTo(fx + w, fy + h, fx + w - radius, fy + h);
  ctx.lineTo(fx + radius, fy + h);
  ctx.quadraticCurveTo(fx, fy + h, fx, fy + h - radius);
  ctx.lineTo(fx, fy + radius);
  ctx.quadraticCurveTo(fx, fy, fx + radius, fy);
  ctx.closePath();

  ctx.fillStyle = figure.color === 'red' ? COLORS.red : COLORS.blue;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Label
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  if (figure.hidden) {
    ctx.font = 'bold 18px Segoe UI';
    ctx.fillText('?', x + CELL/2, y + CELL/2);
  } else {
    const def = FIGURE_DEFS[figure.key];
    if (def) {
      const label = def.label;
      if (label.length <= 2) {
        ctx.font = 'bold 16px Segoe UI';
      } else {
        ctx.font = '18px Segoe UI';
      }
      ctx.fillText(label, x + CELL/2, y + CELL/2);
    }
  }
}

// ============== SIDEBAR ==============

function updateSidebar() {
  if (!state) return;

  const grid = document.getElementById('figures-grid');
  const btnContainer = document.getElementById('btn-container');

  if (state.phase === 'placement' && state.role === 'player') {
    grid.innerHTML = '';
    const remaining = state.remaining || {};

    for (const key of FIGURE_ORDER) {
      const def = FIGURE_DEFS[key];
      const count = remaining[key] || 0;
      const btn = document.createElement('div');
      btn.className = 'figure-btn' + (count === 0 ? ' depleted' : '') + (selectedFigure === key ? ' selected' : '');
      btn.innerHTML = `
        <span class="fig-label">${def.label}</span>
        <span class="fig-name">${def.name}</span>
        ${count > 0 ? `<span class="count">${count}</span>` : ''}
      `;
      btn.style.borderColor = state.myColor === 'red' ? COLORS.red : COLORS.blue;
      if (count > 0) {
        btn.onclick = () => {
          selectedFigure = (selectedFigure === key) ? null : key;
          updateSidebar();
        };
      }
      grid.appendChild(btn);
    }

    const allPlaced = Object.keys(remaining).length === 0;
    btnContainer.innerHTML = '';
    if (state.ready) {
      const btn = document.createElement('button');
      btn.className = 'btn btn-ready active';
      btn.textContent = 'Cancel Ready';
      btn.onclick = () => socket.emit('unready');
      btnContainer.appendChild(btn);
    } else {
      const btn = document.createElement('button');
      btn.className = 'btn btn-ready';
      btn.textContent = 'Ready!';
      btn.disabled = !allPlaced;
      btn.onclick = () => socket.emit('ready');
      btnContainer.appendChild(btn);
    }
  } else {
    grid.innerHTML = '';
    btnContainer.innerHTML = '';
  }

  // Captured
  const capRed = document.getElementById('captured-red');
  const capBlue = document.getElementById('captured-blue');
  capRed.innerHTML = (state.capturedRed || []).map(f => `<div>${FIGURE_DEFS[f.key]?.label || '?'} ${f.name}</div>`).join('');
  capBlue.innerHTML = (state.capturedBlue || []).map(f => `<div>${FIGURE_DEFS[f.key]?.label || '?'} ${f.name}</div>`).join('');
  document.getElementById('captured-red-count').textContent = (state.capturedRed || []).length;
  document.getElementById('captured-blue-count').textContent = (state.capturedBlue || []).length;
}

function updateStatusBar() {
  const bar = document.getElementById('status-bar');
  if (!state) { bar.textContent = 'Connecting...'; return; }

  if (state.phase === 'waiting') {
    if (state.role === 'player') {
      bar.innerHTML = `You are <span style="color:${COLORS[state.myColor]}">${state.myColor.toUpperCase()}</span> - Waiting for opponent...`;
    } else {
      bar.textContent = 'Spectating - Waiting for players...';
    }
  } else if (state.phase === 'placement') {
    if (state.role === 'player') {
      if (state.ready) {
        bar.innerHTML = `<span style="color:${COLORS[state.myColor]}">${state.myColor.toUpperCase()}</span> - Ready! Waiting for opponent... ${state.opponentReady ? '(Opponent ready too!)' : ''}`;
      } else {
        const rem = state.remaining ? Object.values(state.remaining).reduce((a,b) => a+b, 0) : 0;
        bar.innerHTML = `<span style="color:${COLORS[state.myColor]}">${state.myColor.toUpperCase()}</span> - Place your figures! (${rem} remaining) - Click a figure, then click on the board`;
      }
    } else {
      bar.textContent = 'Spectating - Players are placing figures...';
    }
  } else if (state.phase === 'playing') {
    if (state.role === 'player') {
      const isMyTurn = state.turn === state.myColor;
      bar.innerHTML = `<span style="color:${COLORS[state.myColor]}">${state.myColor.toUpperCase()}</span> - ${isMyTurn ? "YOUR TURN - Select a piece to move" : "Opponent's turn..."}`;
    } else {
      bar.innerHTML = `Spectating - <span style="color:${COLORS[state.turn]}">${state.turn?.toUpperCase()}</span>'s turn`;
    }
  } else if (state.phase === 'gameover') {
    if (state.role === 'player') {
      if (state.winner === state.myColor) {
        bar.innerHTML = `<span style="color:#27ae60">YOU WIN!</span>`;
      } else {
        bar.innerHTML = `<span style="color:#e74c3c">YOU LOSE!</span> <span style="color:${COLORS[state.winner]}">${state.winner?.toUpperCase()}</span> wins!`;
      }
    } else {
      bar.innerHTML = `Game Over - <span style="color:${COLORS[state.winner]}">${state.winner?.toUpperCase()}</span> wins!`;
    }
  }
}

// ============== CLICK HANDLER ==============

function handleCanvasInput(clientX, clientY) {
  if (!state) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = BOARD_SIZE / rect.width;
  const scaleY = BOARD_SIZE / rect.height;
  const mx = (clientX - rect.left) * scaleX;
  const my = (clientY - rect.top) * scaleY;
  const col = Math.floor(mx / CELL);
  const row = Math.floor(my / CELL);
  if (row < 0 || row >= 10 || col < 0 || col >= 10) return;

  if (state.role === 'spectator') return;

  if (state.phase === 'placement') {
    handlePlacementClick(row, col);
  } else if (state.phase === 'playing') {
    handlePlayClick(row, col);
  }
}

canvas.addEventListener('click', (e) => {
  handleCanvasInput(e.clientX, e.clientY);
});

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  if (e.changedTouches.length > 0) {
    const touch = e.changedTouches[0];
    handleCanvasInput(touch.clientX, touch.clientY);
  }
}, { passive: false });

function handlePlacementClick(row, col) {
  if (state.ready) return; // locked in

  const placementRows = state.myColor === 'red' ? [6,7,8,9] : [0,1,2,3];
  if (!placementRows.includes(row)) return;

  const cell = state.board[row][col];
  if (cell.type === 'water') return;

  // If cell has own figure, remove it
  if (cell.figure && cell.figure.color === state.myColor) {
    socket.emit('remove_figure', { row, col });
    return;
  }

  // If a figure is selected from sidebar, place it
  if (selectedFigure && !cell.figure) {
    socket.emit('place_figure', { figureKey: selectedFigure, row, col });
    // Auto-deselect if depleted after placement
    // (will be handled by next state update)
    return;
  }
}

function handlePlayClick(row, col) {
  if (state.turn !== state.myColor) return;

  const cell = state.board[row][col];

  // If we have a piece selected and clicking on allowed move
  if (selectedCell) {
    const isAllowed = allowedMoves.some(([mr, mc]) => mr === row && mc === col);
    if (isAllowed) {
      socket.emit('move', {
        fromRow: selectedCell[0],
        fromCol: selectedCell[1],
        toRow: row,
        toCol: col,
      });
      selectedCell = null;
      allowedMoves = [];
      drawBoard();
      return;
    }
    // Clicking on own piece - switch selection
    if (cell.figure && !cell.figure.hidden && cell.figure.color === state.myColor) {
      selectedCell = [row, col];
      socket.emit('get_moves', { row, col });
      allowedMoves = [];
      drawBoard();
      return;
    }
    // Clicking elsewhere - deselect
    selectedCell = null;
    allowedMoves = [];
    drawBoard();
    return;
  }

  // No piece selected - select own piece
  if (cell.figure && !cell.figure.hidden && cell.figure.color === state.myColor) {
    selectedCell = [row, col];
    socket.emit('get_moves', { row, col });
    allowedMoves = [];
    drawBoard();
  }
}

// ============== COMBAT OVERLAY ==============

function showCombatOverlay(data) {
  const overlay = document.getElementById('combat-overlay');
  const attBox = document.getElementById('combat-attacker');
  const defBox = document.getElementById('combat-defender');
  const resultText = document.getElementById('combat-result-text');

  const attDef = FIGURE_DEFS[data.attacker.key];
  const defDef = FIGURE_DEFS[data.defender.key];

  attBox.style.background = data.attacker.color === 'red' ? COLORS.red : COLORS.blue;
  defBox.style.background = data.defender.color === 'red' ? COLORS.red : COLORS.blue;

  attBox.innerHTML = `<span style="font-size:22px">${attDef?.label || '?'}</span><span style="font-size:11px">${data.attacker.name}</span>`;
  defBox.innerHTML = `<span style="font-size:22px">${defDef?.label || '?'}</span><span style="font-size:11px">${data.defender.name}</span>`;

  attBox.className = 'combat-fig';
  defBox.className = 'combat-fig';

  if (data.result === 'attacker_wins') {
    attBox.classList.add('winner');
    defBox.classList.add('loser');
    resultText.innerHTML = `<span style="color:${COLORS[data.attacker.color]}">${data.attacker.name}</span> defeats <span style="color:${COLORS[data.defender.color]}">${data.defender.name}</span>!`;
  } else if (data.result === 'defender_wins') {
    attBox.classList.add('loser');
    defBox.classList.add('winner');
    resultText.innerHTML = `<span style="color:${COLORS[data.defender.color]}">${data.defender.name}</span> defeats <span style="color:${COLORS[data.attacker.color]}">${data.attacker.name}</span>!`;
  } else {
    attBox.classList.add('draw');
    defBox.classList.add('draw');
    resultText.textContent = 'Both pieces destroyed!';
  }

  overlay.classList.add('show');
  setTimeout(() => overlay.classList.remove('show'), 2000);
}

// ============== SOCKET EVENTS ==============

socket.on('game_state', (data) => {
  state = data;
  selectedCell = null;
  allowedMoves = [];

  // Auto-deselect figure if depleted
  if (state.phase === 'placement' && selectedFigure) {
    const remaining = state.remaining || {};
    if (!remaining[selectedFigure] || remaining[selectedFigure] <= 0) {
      selectedFigure = null;
    }
  }

  drawBoard();
  updateSidebar();
  updateStatusBar();
});

socket.on('allowed_moves', (data) => {
  allowedMoves = data.moves;
  drawBoard();
});

socket.on('combat_result', (data) => {
  showCombatOverlay(data);
});

socket.on('game_reset', () => {
  window.location.reload();
});

socket.on('disconnect', () => {
  document.getElementById('status-bar').textContent = 'Disconnected from server. Refresh to reconnect.';
});

// Initial draw
drawBoard();
</script>
</body>
</html>
