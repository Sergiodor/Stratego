<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Stratego Online</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #1a1a2e;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    overflow-x: hidden;
  }
  #status-bar {
    width: 100%;
    text-align: center;
    padding: 10px 8px;
    font-size: 16px;
    font-weight: bold;
    background: #16213e;
    border-bottom: 2px solid #0f3460;
    min-height: 44px;
    position: relative;
  }
  #lang-switcher {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    gap: 0;
    border: 1px solid #0f3460;
    border-radius: 4px;
    overflow: hidden;
    font-size: 12px;
  }
  #lang-switcher button {
    background: #1a1a2e;
    color: #888;
    border: none;
    padding: 4px 10px;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
    transition: all 0.15s;
  }
  #lang-switcher button:hover {
    background: #0f3460;
    color: #ccc;
  }
  #lang-switcher button.active {
    background: #e94560;
    color: #fff;
  }
  .waiting-timer {
    display: inline-block;
    animation: pulse-timer 1.5s ease-in-out infinite;
    margin-right: 6px;
    font-size: 18px;
  }
  @keyframes pulse-timer {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }
  #main {
    display: flex;
    gap: 20px;
    margin-top: 15px;
    align-items: flex-start;
    padding: 0 10px 20px;
    width: 100%;
    max-width: 760px;
    justify-content: center;
  }
  #board-container {
    position: relative;
    flex-shrink: 0;
  }
  #board-column {
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  #captured-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    width: 500px;
  }
  .captured-panel {
    flex: 1;
    min-width: 0;
  }
  .captured-panel h3 {
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  canvas {
    border: 3px solid #0f3460;
    border-radius: 4px;
    cursor: pointer;
    display: block;
    width: 500px;
    height: 500px;
  }
  #sidebar {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 220px;
    min-width: 180px;
    flex-shrink: 1;
  }
  .panel {
    background: #16213e;
    border: 2px solid #0f3460;
    border-radius: 6px;
    padding: 10px;
  }
  .panel h3 {
    text-align: center;
    margin-bottom: 8px;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #figures-panel {
    max-height: 500px;
    overflow-y: auto;
  }
  #figures-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    justify-content: center;
  }
  .figure-btn {
    width: 48px;
    height: 48px;
    border: 2px solid #444;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: bold;
    transition: all 0.15s;
    position: relative;
    background: #1a1a2e;
    color: #eee;
    -webkit-tap-highlight-color: transparent;
  }
  .figure-btn:hover { border-color: #e94560; transform: scale(1.08); }
  .figure-btn.selected { border-color: #e94560; background: #e9456033; box-shadow: 0 0 10px #e94560aa; }
  .figure-btn.depleted { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
  .figure-btn .count {
    position: absolute;
    top: -4px;
    right: -4px;
    background: #e94560;
    color: white;
    border-radius: 50%;
    width: 18px;
    height: 18px;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .figure-btn .fig-label {
    font-size: 16px;
    line-height: 1;
  }
  .figure-btn .fig-name {
    font-size: 8px;
    margin-top: 1px;
  }
  .captured-list {
    font-size: 12px;
    max-height: 200px;
    overflow-y: auto;
  }
  .captured-list div {
    padding: 2px 4px;
    border-bottom: 1px solid #0f346044;
  }
  .captured-roster {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 4px 0;
  }
  .roster-item {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: bold;
    border: 1px solid #0f346066;
    background: #1a1a2e;
    color: #555;
    opacity: 0.35;
    transition: all 0.3s;
  }
  .roster-item.captured {
    opacity: 1;
    color: #fff;
  }
  .roster-item.captured.red {
    background: #c0392b;
    border-color: #e74c3c;
  }
  .roster-item.captured.blue {
    background: #2471a3;
    border-color: #3498db;
  }
  #btn-container {
    text-align: center;
  }
  .btn {
    padding: 10px 24px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-ready {
    background: #27ae60;
    color: white;
  }
  .btn-ready:hover { background: #2ecc71; }
  .btn-ready.active {
    background: #e94560;
  }
  .btn-ready.active:hover { background: #c0392b; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #combat-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  #combat-overlay.show { display: flex; }
  #combat-box {
    background: #16213e;
    border: 3px solid #e94560;
    border-radius: 12px;
    padding: 24px 20px;
    text-align: center;
    min-width: 280px;
    max-width: 90vw;
  }
  #combat-box h2 { margin-bottom: 15px; font-size: 20px; }
  .combat-figures {
    display: flex;
    gap: 20px;
    justify-content: center;
    align-items: center;
    margin: 15px 0;
  }
  .combat-fig {
    width: 70px;
    height: 70px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: bold;
    border: 3px solid #444;
  }
  .combat-fig.winner { border-color: #27ae60; box-shadow: 0 0 15px #27ae6088; }
  .combat-fig.loser { border-color: #e74c3c; opacity: 0.5; }
  .combat-fig.draw { border-color: #f39c12; opacity: 0.6; }
  .combat-vs { font-size: 24px; font-weight: bold; color: #e94560; }
  #combat-result-text { font-size: 16px; margin-top: 10px; }

  /* ---- Responsive ---- */
  @media (max-width: 760px) {
    #main {
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
      padding-bottom: 20px;
    }
    #board-container {
      width: 100%;
      max-width: 500px;
    }
    #board-column {
      width: 100%;
      max-width: 500px;
      align-items: center;
    }
    #captured-row {
      width: 100%;
      max-width: 500px;
    }
    canvas {
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
    }
    #sidebar {
      width: 100%;
      max-width: 500px;
      flex-direction: column;
    }
    #figures-panel {
      max-height: none;
    }
    #figures-grid {
      gap: 6px;
    }
    .figure-btn {
      width: 44px;
      height: 44px;
    }
    .figure-btn .fig-label { font-size: 14px; }
    .figure-btn .fig-name { font-size: 7px; }
    .captured-list { max-height: 160px; }
    #status-bar { font-size: 14px; padding: 8px 6px; }
    #lang-switcher button { padding: 3px 7px; font-size: 11px; }
    .combat-fig { width: 60px; height: 60px; }
    .combat-figures { gap: 14px; }
    #combat-box { padding: 18px 14px; min-width: 240px; }
  }

  @media (max-width: 400px) {
    .figure-btn {
      width: 38px;
      height: 38px;
    }
    .figure-btn .fig-label { font-size: 13px; }
    .figure-btn .fig-name { display: none; }
    .figure-btn .count { width: 16px; height: 16px; font-size: 9px; }
    #status-bar { font-size: 12px; }
    .combat-fig { width: 50px; height: 50px; font-size: 12px; }
    #combat-result-text { font-size: 13px; }
  }
</style>
</head>
<body>

<div id="status-bar">
  <span id="status-text">Connecting...</span>
  <div id="lang-switcher">
    <button id="lang-en" class="active" onclick="setLang('en')">EN</button>
    <button id="lang-ua" onclick="setLang('ua')">UA</button>
  </div>
</div>

<div id="main">
  <div id="board-column">
    <div id="board-container">
      <canvas id="gameCanvas" width="500" height="500"></canvas>
    </div>
    <div id="captured-row">
      <div class="panel captured-panel" id="captured-my-panel">
        <h3 id="captured-my-header"></h3>
        <div class="captured-list" id="captured-my"></div>
      </div>
      <div class="panel captured-panel" id="captured-opp-panel">
        <h3 id="captured-opp-header"></h3>
        <div class="captured-list" id="captured-opp"></div>
      </div>
    </div>
  </div>
  <div id="sidebar">
    <div class="panel" id="figures-panel">
      <h3>Figures</h3>
      <div id="figures-grid"></div>
    </div>
    <div id="btn-container"></div>
  </div>
</div>

<div id="combat-overlay">
  <div id="combat-box">
    <h2>Combat!</h2>
    <div class="combat-figures">
      <div class="combat-fig" id="combat-attacker"></div>
      <div class="combat-vs">VS</div>
      <div class="combat-fig" id="combat-defender"></div>
    </div>
    <div id="combat-result-text"></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

// ============== TRANSLATIONS ==============

const TRANSLATIONS = {
  en: {
    connecting: 'Connecting...',
    youAre: 'You are',
    waitingForOpponent: 'Waiting for opponent...',
    ready: 'Ready!',
    waitingForOpponentReady: 'Waiting for opponent...',
    opponentReadyToo: '(Opponent ready too!)',
    placeFigures: 'Place your figures!',
    remaining: 'remaining',
    clickFigureThenBoard: 'Click a figure, then click on the board',
    yourTurn: 'YOUR TURN - Select a piece to move',
    opponentTurn: "Opponent's turn...",
    youWin: 'YOU WIN!',
    youLose: 'YOU LOSE!',
    wins: 'wins!',
    newGameIn: 'New game in',
    disconnected: 'disconnected - reconnecting in',
    disconnectedFromServer: 'Disconnected from server. Refresh to reconnect.',
    gameIsFull: 'Game is full.',
    figures: 'Figures',
    capturedRed: 'Captured Red',
    capturedBlue: 'Captured Blue',
    cancelReady: 'Cancel Ready',
    combat: 'Combat!',
    defeats: 'defeats',
    bothDestroyed: 'Both pieces destroyed!',
    // Figure names
    fig_bomb: 'Bomb',
    fig_flag: 'Flag',
    fig_spy: 'Spy',
    fig_scout: 'Scout',
    fig_miner: 'Miner',
    fig_sergeant: 'Sergeant',
    fig_lieutenant: 'Lieutenant',
    fig_captain: 'Captain',
    fig_major: 'Major',
    fig_colonel: 'Colonel',
    fig_general: 'General',
    fig_marshal: 'Marshal',
  },
  ua: {
    connecting: "З'єднання...",
    youAre: 'Ви',
    waitingForOpponent: 'Очікування суперника...',
    ready: 'Готовий!',
    waitingForOpponentReady: 'Очікування суперника...',
    opponentReadyToo: '(Суперник теж готовий!)',
    placeFigures: 'Розставте фігури!',
    remaining: 'залишилось',
    clickFigureThenBoard: 'Оберіть фігуру, потім натисніть на поле',
    yourTurn: 'ВАШ ХІД - Оберіть фігуру для ходу',
    opponentTurn: 'Хід суперника...',
    youWin: 'ВИ ПЕРЕМОГЛИ!',
    youLose: 'ВИ ПРОГРАЛИ!',
    wins: 'переміг!',
    newGameIn: 'Нова гра через',
    disconnected: "від'єднався - перепідключення через",
    disconnectedFromServer: "Від'єднано від сервера. Оновіть сторінку.",
    gameIsFull: 'Гра заповнена.',
    figures: 'Фігури',
    capturedRed: 'Захоплені Червоні',
    capturedBlue: 'Захоплені Сині',
    cancelReady: 'Скасувати',
    combat: 'Бій!',
    defeats: 'перемагає',
    bothDestroyed: 'Обидві фігури знищені!',
    // Figure names
    fig_bomb: 'Бомба',
    fig_flag: 'Прапор',
    fig_spy: 'Шпигун',
    fig_scout: 'Розвідник',
    fig_miner: 'Мінер',
    fig_sergeant: 'Сержант',
    fig_lieutenant: 'Лейтенант',
    fig_captain: 'Капітан',
    fig_major: 'Майор',
    fig_colonel: 'Полковник',
    fig_general: 'Генерал',
    fig_marshal: 'Маршал',
  }
};

let currentLang = localStorage.getItem('stratego-lang') || 'en';

function t(key) {
  return (TRANSLATIONS[currentLang] && TRANSLATIONS[currentLang][key]) || TRANSLATIONS.en[key] || key;
}

function figName(key) {
  return t('fig_' + key);
}

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('stratego-lang', lang);
  document.getElementById('lang-en').className = lang === 'en' ? 'active' : '';
  document.getElementById('lang-ua').className = lang === 'ua' ? 'active' : '';
  document.title = 'Stratego Online';
  // Re-render all UI
  updateSidebar();
  updateStatusBar();
  updateStaticLabels();
}

function updateStaticLabels() {
  document.querySelector('#combat-box h2').textContent = t('combat');
}

const CELL = 50;
const COLORS = {
  red: 'OrangeRed',
  blue: 'MediumTurquoise',
  ground: '#229954',
  groundDark: '#1e8449',
  water: '#2980b9',
  highlight: 'rgba(212,244,201,0.5)',
  highlightAttack: 'rgba(231,76,60,0.4)',
  selected: 'rgba(241,196,15,0.4)',
};

const FIGURE_DEFS = {
  bomb:       { name: 'Bomb',       label: '\u{1F4A3}', rate: 100, count: 6 },
  flag:       { name: 'Flag',       label: '\u{1F6A9}', rate: 0,   count: 1 },
  spy:        { name: 'Spy',        label: '1',  rate: 1,  count: 1 },
  scout:      { name: 'Scout',      label: '2',  rate: 2,  count: 8 },
  miner:      { name: 'Miner',      label: '3',  rate: 3,  count: 5 },
  sergeant:   { name: 'Sergeant',   label: '4',  rate: 4,  count: 4 },
  lieutenant: { name: 'Lieutenant', label: '5',  rate: 5,  count: 4 },
  captain:    { name: 'Captain',    label: '6',  rate: 6,  count: 4 },
  major:      { name: 'Major',      label: '7',  rate: 7,  count: 3 },
  colonel:    { name: 'Colonel',    label: '8',  rate: 8,  count: 2 },
  general:    { name: 'General',    label: '9',  rate: 9,  count: 1 },
  marshal:    { name: 'Marshal',    label: '10', rate: 10, count: 1 },
};

const FIGURE_ORDER = ['flag','bomb','spy','scout','miner','sergeant','lieutenant','captain','major','colonel','general','marshal'];

const BOARD_SIZE = 500; // logical canvas resolution (10 * CELL)

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let state = null;       // latest game_state from server
let selectedFigure = null; // figure key selected from sidebar (placement)
let selectedCell = null;   // [row, col] selected on board (playing)
let allowedMoves = [];     // [[row,col], ...] for currently selected piece
let gameoverTimestamp = null; // when gameover was first detected (for reset countdown)

// ============== MOVE ARROWS & ANIMATION ==============

// Arrow state: { fromRow, fromCol, toRow, toCol } in logical coords, or null
let oppLastMove = null;   // arrow for opponent's last move (shown until I move)

// Animation state
let moveAnimation = null; // { figure, fromX, fromY, toX, toY, startTime, duration, pendingState, pendingCombat }
const ANIM_DURATION = 200; // ms

// Revealed opponent figures (when they kill my figure, show their value until my next turn)
let revealedFigures = new Map(); // Map of "row,col" -> figure key (e.g., "3,4" -> "major")

// ============== BOARD ORIENTATION ==============

// Returns true if the board should be flipped (blue player sees their pieces at bottom)
function shouldFlip() {
  return state && state.role === 'player' && state.myColor === 'blue';
}

// Convert logical board row/col to display row/col
function toDisplay(r, c) {
  if (shouldFlip()) return [9 - r, 9 - c];
  return [r, c];
}

// Convert display row/col back to logical board row/col
function fromDisplay(dr, dc) {
  if (shouldFlip()) return [9 - dr, 9 - dc];
  return [dr, dc];
}

// ============== DRAWING ==============

function drawArrow(fromRow, fromCol, toRow, toCol, color) {
  const [fdr, fdc] = toDisplay(fromRow, fromCol);
  const [tdr, tdc] = toDisplay(toRow, toCol);
  const fx = fdc * CELL + CELL / 2;
  const fy = fdr * CELL + CELL / 2;
  const tx = tdc * CELL + CELL / 2;
  const ty = tdr * CELL + CELL / 2;

  const angle = Math.atan2(ty - fy, tx - fx);
  const headLen = 12;

  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 3;
  ctx.globalAlpha = 0.7;

  // Line
  ctx.beginPath();
  ctx.moveTo(fx, fy);
  ctx.lineTo(tx - Math.cos(angle) * headLen * 0.5, ty - Math.sin(angle) * headLen * 0.5);
  ctx.stroke();

  // Arrowhead
  ctx.beginPath();
  ctx.moveTo(tx, ty);
  ctx.lineTo(tx - headLen * Math.cos(angle - Math.PI / 6), ty - headLen * Math.sin(angle - Math.PI / 6));
  ctx.lineTo(tx - headLen * Math.cos(angle + Math.PI / 6), ty - headLen * Math.sin(angle + Math.PI / 6));
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawBoard() {
  if (!state) return;
  ctx.clearRect(0, 0, BOARD_SIZE, BOARD_SIZE);

  for (let r = 0; r < 10; r++) {
    for (let c = 0; c < 10; c++) {
      const [dr, dc] = toDisplay(r, c);
      const x = dc * CELL;
      const y = dr * CELL;
      const cell = state.board[r][c];

      // Ground
      if (cell.type === 'water') {
        ctx.fillStyle = COLORS.water;
        ctx.fillRect(x, y, CELL, CELL);
        // Wave pattern
        ctx.strokeStyle = '#3498db';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let w = 0; w < 3; w++) {
          const wy = y + 15 + w * 10;
          ctx.moveTo(x + 3, wy);
          ctx.quadraticCurveTo(x + 12, wy - 5, x + 25, wy);
          ctx.quadraticCurveTo(x + 37, wy + 5, x + 47, wy);
        }
        ctx.stroke();
      } else {
        // Checkerboard green
        ctx.fillStyle = (r + c) % 2 === 0 ? COLORS.ground : COLORS.groundDark;
        ctx.fillRect(x, y, CELL, CELL);
      }

      // Highlight placement area during placement phase
      if (state.phase === 'placement' && state.role === 'player' && cell.type !== 'water') {
        const placementRows = state.myColor === 'red' ? [6,7,8,9] : [0,1,2,3];
        if (placementRows.includes(r) && !cell.figure) {
          ctx.fillStyle = 'rgba(255,255,255,0.08)';
          ctx.fillRect(x, y, CELL, CELL);
        }
      }

      // Highlight selected cell
      if (selectedCell && selectedCell[0] === r && selectedCell[1] === c) {
        ctx.fillStyle = COLORS.selected;
        ctx.fillRect(x, y, CELL, CELL);
      }

      // Highlight allowed moves
      if (allowedMoves.some(([mr, mc]) => mr === r && mc === c)) {
        const targetHasFigure = cell.figure;
        ctx.fillStyle = targetHasFigure ? COLORS.highlightAttack : COLORS.highlight;
        ctx.fillRect(x, y, CELL, CELL);
        // Draw dot for empty, X for attack
        if (!targetHasFigure) {
          ctx.beginPath();
          ctx.arc(x + CELL/2, y + CELL/2, 6, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,0.4)';
          ctx.fill();
        }
      }

      // Draw figure (skip if being animated)
      if (cell.figure) {
        const isAnimating = moveAnimation && moveAnimation.logicalTo &&
          moveAnimation.logicalTo[0] === r && moveAnimation.logicalTo[1] === c;
        if (!isAnimating) {
          drawFigure(x, y, cell.figure, r, c);
        }
      }

      // Grid line
      ctx.strokeStyle = 'rgba(0,0,0,0.15)';
      ctx.lineWidth = 0.5;
      ctx.strokeRect(x, y, CELL, CELL);
    }
  }

  // Draw move arrows (only show opponent's arrow)
  if (oppLastMove) {
    drawArrow(oppLastMove.fromRow, oppLastMove.fromCol, oppLastMove.toRow, oppLastMove.toCol, '#ff8c00');
  }

  // Draw animated figure
  if (moveAnimation) {
    const elapsed = Date.now() - moveAnimation.startTime;
    const progress = Math.min(1, elapsed / moveAnimation.duration);
    // Ease out quad
    const ease = 1 - (1 - progress) * (1 - progress);
    const cx = moveAnimation.fromX + (moveAnimation.toX - moveAnimation.fromX) * ease;
    const cy = moveAnimation.fromY + (moveAnimation.toY - moveAnimation.fromY) * ease;
    drawFigure(cx, cy, moveAnimation.figure);

    if (progress < 1) {
      requestAnimationFrame(() => drawBoard());
    } else {
      // Animation complete
      const pending = moveAnimation.pendingState;
      const pendingCombat = moveAnimation.pendingCombat;
      moveAnimation = null;
      if (pending) {
        applyGameState(pending);
      }
      if (pendingCombat) {
        playCombatSound(pendingCombat);
        showCombatOverlay(pendingCombat);
      }
    }
  }
}

function drawFigure(x, y, figure, row, col) {
  const padding = 3;
  const w = CELL - padding * 2;
  const h = CELL - padding * 2;
  const fx = x + padding;
  const fy = y + padding;
  const radius = 5;

  // Rounded rect
  ctx.beginPath();
  ctx.moveTo(fx + radius, fy);
  ctx.lineTo(fx + w - radius, fy);
  ctx.quadraticCurveTo(fx + w, fy, fx + w, fy + radius);
  ctx.lineTo(fx + w, fy + h - radius);
  ctx.quadraticCurveTo(fx + w, fy + h, fx + w - radius, fy + h);
  ctx.lineTo(fx + radius, fy + h);
  ctx.quadraticCurveTo(fx, fy + h, fx, fy + h - radius);
  ctx.lineTo(fx, fy + radius);
  ctx.quadraticCurveTo(fx, fy, fx + radius, fy);
  ctx.closePath();

  ctx.fillStyle = figure.color === 'red' ? COLORS.red : COLORS.blue;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Label
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Check if this opponent figure should be revealed (when row/col provided)
  const revealedKey = row !== undefined && col !== undefined ? 
    revealedFigures.get(`${row},${col}`) : null;

  if (figure.hidden) {
    if (revealedKey) {
      console.log('Revealing figure at', row, col, '- using key:', revealedKey);
    }
  }

  if (figure.hidden && !revealedKey) {
    ctx.font = 'bold 18px Segoe UI';
    ctx.fillText('?', x + CELL/2, y + CELL/2);
  } else {
    // Use revealed key if available, otherwise use figure's key
    const keyToUse = revealedKey || figure.key;
    const def = FIGURE_DEFS[keyToUse];
    if (def) {
      const label = def.label;
      if (label.length <= 2) {
        ctx.font = 'bold 16px Segoe UI';
      } else {
        ctx.font = '18px Segoe UI';
      }
      ctx.fillText(label, x + CELL/2, y + CELL/2);
    }
  }
}

// ============== SIDEBAR ==============

function updateSidebar() {
  // Always update static labels regardless of state
  document.querySelector('#figures-panel h3').textContent = t('figures');

  const myColor = state ? state.myColor : 'red';
  const oppColor = myColor === 'red' ? 'blue' : 'red';
  const myColorStyle = myColor === 'red' ? 'OrangeRed' : 'MediumTurquoise';
  const oppColorStyle = oppColor === 'red' ? 'OrangeRed' : 'MediumTurquoise';
  const myCapturedKey = myColor === 'red' ? 'capturedRed' : 'capturedBlue';
  const oppCapturedKey = oppColor === 'red' ? 'capturedRed' : 'capturedBlue';
  const myCount = state ? (state[myCapturedKey] || []).length : 0;
  const oppCount = state ? (state[oppCapturedKey] || []).length : 0;

  document.getElementById('captured-my-header').innerHTML = `<span style="color: ${myColorStyle};">${t(myCapturedKey)} (${myCount})</span>`;
  document.getElementById('captured-opp-header').innerHTML = `<span style="color: ${oppColorStyle};">${t(oppCapturedKey)} (${oppCount})</span>`;

  if (!state) return;

  const grid = document.getElementById('figures-grid');
  const btnContainer = document.getElementById('btn-container');
  const figuresPanel = document.getElementById('figures-panel');

  if (state.phase === 'placement' && state.role === 'player') {
    // Show figures panel during placement
    figuresPanel.style.display = 'block';
    
    // Hide figures panel if player is ready
    if (state.ready) {
      figuresPanel.style.display = 'none';
    }
    
    grid.innerHTML = '';
    const remaining = state.remaining || {};

    for (const key of FIGURE_ORDER) {
      const def = FIGURE_DEFS[key];
      const count = remaining[key] || 0;
      const btn = document.createElement('div');
      btn.className = 'figure-btn' + (count === 0 ? ' depleted' : '') + (selectedFigure === key ? ' selected' : '');
      btn.innerHTML = `
        <span class="fig-label">${def.label}</span>
        <span class="fig-name">${figName(key)}</span>
        ${count > 0 ? `<span class="count">${count}</span>` : ''}
      `;
      btn.style.borderColor = state.myColor === 'red' ? COLORS.red : COLORS.blue;
      if (count > 0) {
        btn.onclick = () => {
          selectedFigure = (selectedFigure === key) ? null : key;
          updateSidebar();
        };
      }
      grid.appendChild(btn);
    }

    const allPlaced = Object.keys(remaining).length === 0;
    btnContainer.innerHTML = '';
    if (state.ready) {
      const btn = document.createElement('button');
      btn.className = 'btn btn-ready active';
      btn.textContent = t('cancelReady');
      btn.onclick = () => socket.emit('unready');
      btnContainer.appendChild(btn);
    } else {
      const btn = document.createElement('button');
      btn.className = 'btn btn-ready';
      btn.textContent = t('ready');
      btn.disabled = !allPlaced;
      btn.onclick = () => socket.emit('ready');
      btnContainer.appendChild(btn);
    }
  } else {
    // Hide figures panel in non-placement phases
    figuresPanel.style.display = 'none';
    grid.innerHTML = '';
    btnContainer.innerHTML = '';
  }

  // Captured rosters
  const capMy = document.getElementById('captured-my');
  const capOpp = document.getElementById('captured-opp');

  function buildRoster(capturedList, color) {
    const capturedCounts = {};
    for (const f of (capturedList || [])) {
      capturedCounts[f.key] = (capturedCounts[f.key] || 0) + 1;
    }

    let html = '<div class="captured-roster">';
    for (const key of FIGURE_ORDER) {
      const def = FIGURE_DEFS[key];
      const total = def.count;
      const killed = capturedCounts[key] || 0;
      for (let i = 0; i < total; i++) {
        const isCaptured = i < killed;
        const cls = isCaptured ? `roster-item captured ${color}` : 'roster-item';
        html += `<span class="${cls}" title="${figName(key)}">${def.label}</span>`;
      }
    }
    html += '</div>';
    return html;
  }

  capMy.innerHTML = buildRoster(state[myCapturedKey], myColor);
  capOpp.innerHTML = buildRoster(state[oppCapturedKey], oppColor);
}

let countdownInterval = null;

function startCountdown() {
  stopCountdown();
  countdownInterval = setInterval(() => updateStatusBar(), 500);
}

function stopCountdown() {
  if (countdownInterval) {
    clearInterval(countdownInterval);
    countdownInterval = null;
  }
}

function updateStatusBar() {
  const bar = document.getElementById('status-text');
  if (!state) { bar.textContent = t('connecting'); return; }

  // Disconnect countdown takes priority over normal status
  if (state.disconnectedColor && state.reconnectDeadline && state.phase !== 'gameover') {
    const remaining = Math.max(0, Math.ceil((state.reconnectDeadline - Date.now()) / 1000));
    const dcColor = state.disconnectedColor;
    bar.innerHTML = `<span style="color:${COLORS[dcColor]}">${dcColor.toUpperCase()}</span> ${t('disconnected')} <span style="color:#e94560">${remaining}s</span>...`;
    if (remaining > 0 && !countdownInterval) startCountdown();
    return;
  }

  if (state.phase === 'waiting') {
    stopCountdown();
    bar.innerHTML = `${t('youAre')} <span style="color:${COLORS[state.myColor]}">${state.myColor.toUpperCase()}</span> - ${t('waitingForOpponent')}`;
  } else if (state.phase === 'placement') {
    stopCountdown();
    if (state.ready) {
      bar.innerHTML = `<span style="color:${COLORS[state.myColor]}">${state.myColor.toUpperCase()}</span> - ${t('ready')} ${t('waitingForOpponentReady')} ${state.opponentReady ? t('opponentReadyToo') : ''}`;
    } else {
      const rem = state.remaining ? Object.values(state.remaining).reduce((a,b) => a+b, 0) : 0;
      bar.innerHTML = `<span style="color:${COLORS[state.myColor]}">${state.myColor.toUpperCase()}</span> - ${t('placeFigures')} (${rem} ${t('remaining')}) - ${t('clickFigureThenBoard')}`;
    }
  } else if (state.phase === 'playing') {
    stopCountdown();
    const isMyTurn = state.turn === state.myColor;
    bar.innerHTML = `<span style="color:${COLORS[state.myColor]}">${state.myColor.toUpperCase()}</span> - ${isMyTurn ? t('yourTurn') : '<span class="waiting-timer">\u23F3</span>' + t('opponentTurn')}`;
  } else if (state.phase === 'gameover') {
    let msg = '';
    if (state.winner === state.myColor) {
      msg = `<span style="color:#27ae60">${t('youWin')}</span>`;
    } else {
      msg = `<span style="color:#e74c3c">${t('youLose')}</span> <span style="color:${COLORS[state.winner]}">${state.winner?.toUpperCase()}</span> ${t('wins')}`;
    }
    // Show reset countdown (server resets 10s after gameover)
    if (gameoverTimestamp) {
      const elapsed = (Date.now() - gameoverTimestamp) / 1000;
      const resetIn = Math.max(0, Math.ceil(10 - elapsed));
      msg += ` <span style="color:#888">${t('newGameIn')} ${resetIn}s</span>`;
      if (!countdownInterval) startCountdown();
    }
    bar.innerHTML = msg;
  }
}

// ============== CLICK HANDLER ==============

function handleCanvasInput(clientX, clientY) {
  if (!state) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = BOARD_SIZE / rect.width;
  const scaleY = BOARD_SIZE / rect.height;
  const mx = (clientX - rect.left) * scaleX;
  const my = (clientY - rect.top) * scaleY;
  const displayCol = Math.floor(mx / CELL);
  const displayRow = Math.floor(my / CELL);
  if (displayRow < 0 || displayRow >= 10 || displayCol < 0 || displayCol >= 10) return;

  // Convert display coordinates to logical board coordinates
  const [row, col] = fromDisplay(displayRow, displayCol);

  if (state.phase === 'placement') {
    handlePlacementClick(row, col);
  } else if (state.phase === 'playing') {
    handlePlayClick(row, col);
  }
}

let usedTouch = false; // flag to prevent double-fire from touch + synthesized click

canvas.addEventListener('click', (e) => {
  if (usedTouch) { usedTouch = false; return; }
  handleCanvasInput(e.clientX, e.clientY);
});

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault(); // prevents scroll and zoom on canvas
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  usedTouch = true;
  if (e.changedTouches.length > 0) {
    const touch = e.changedTouches[0];
    handleCanvasInput(touch.clientX, touch.clientY);
  }
}, { passive: false });

function handlePlacementClick(row, col) {
  if (state.ready) return; // locked in

  const placementRows = state.myColor === 'red' ? [6,7,8,9] : [0,1,2,3];
  if (!placementRows.includes(row)) return;

  const cell = state.board[row][col];
  if (cell.type === 'water') return;

  // If cell has own figure, remove it
  if (cell.figure && cell.figure.color === state.myColor) {
    socket.emit('remove_figure', { row, col });
    return;
  }

  // If a figure is selected from sidebar, place it
  if (selectedFigure && !cell.figure) {
    socket.emit('place_figure', { figureKey: selectedFigure, row, col });
    // Auto-deselect if depleted after placement
    // (will be handled by next state update)
    return;
  }
}

function handlePlayClick(row, col) {
  if (state.turn !== state.myColor) return;

  const cell = state.board[row][col];

  // If we have a piece selected and clicking on allowed move
  if (selectedCell) {
    const isAllowed = allowedMoves.some(([mr, mc]) => mr === row && mc === col);
    if (isAllowed) {
      const fromRow = selectedCell[0];
      const fromCol = selectedCell[1];
      const toRow = row;
      const toCol = col;

      // Clear opponent's arrow when I move (don't store my own arrow)
      oppLastMove = null;

      // Get the figure being moved for animation
      const movingFigure = state.board[fromRow][fromCol].figure;

      // Start animation
      const [fdr, fdc] = toDisplay(fromRow, fromCol);
      const [tdr, tdc] = toDisplay(toRow, toCol);
      moveAnimation = {
        figure: movingFigure,
        fromX: fdc * CELL,
        fromY: fdr * CELL,
        toX: tdc * CELL,
        toY: tdr * CELL,
        startTime: Date.now(),
        duration: ANIM_DURATION,
        logicalFrom: [fromRow, fromCol],
        logicalTo: [toRow, toCol],
        pendingState: null,
        pendingCombat: null,
      };

      // Remove figure from source cell visually (for animation)
      state.board[fromRow][fromCol].figure = null;

      // Clear revealed figures when player makes a move (completing their turn)
      revealedFigures.clear();

      socket.emit('move', { fromRow, fromCol, toRow, toCol });
      selectedCell = null;
      allowedMoves = [];
      drawBoard();
      return;
    }
    // Clicking on own piece - switch selection
    if (cell.figure && !cell.figure.hidden && cell.figure.color === state.myColor) {
      selectedCell = [row, col];
      socket.emit('get_moves', { row, col });
      allowedMoves = [];
      drawBoard();
      return;
    }
    // Clicking elsewhere - deselect
    selectedCell = null;
    allowedMoves = [];
    drawBoard();
    return;
  }

  // No piece selected - select own piece
  if (cell.figure && !cell.figure.hidden && cell.figure.color === state.myColor) {
    selectedCell = [row, col];
    socket.emit('get_moves', { row, col });
    allowedMoves = [];
    drawBoard();
  }
}

  defBox.style.background = data.defender.color === 'red' ? COLORS.red : COLORS.blue;

  const attName = figName(data.attacker.key);
  const defName = figName(data.defender.key);

  attBox.innerHTML = `<span style="font-size:22px">${attDef?.label || '?'}</span><span style="font-size:11px">${attName}</span>`;
  defBox.innerHTML = `<span style="font-size:22px">${defDef?.label || '?'}</span><span style="font-size:11px">${defName}</span>`;

  defBox.className = 'combat-fig';

  document.querySelector('#combat-box h2').textContent = t('combat');

  if (data.result === 'attacker_wins') {

    defBox.classList.add('loser');
    resultText.innerHTML = `<span style="color:${COLORS[data.attacker.color]}">${attName}</span> ${t('defeats')} <span style="color:${COLORS[data.defender.color]}">${defName}</span>!`;

    defBox.classList.add('winner');
    resultText.innerHTML = `<span style="color:${COLORS[data.defender.color]}">${defName}</span> ${t('defeats')} <span style="color:${COLORS[data.attacker.color]}">${attName}</span>!`;
  } else {
    attBox.classList.add('draw');

    overlay.classList.remove('show');
    combatOverlayTimer = null;
  }, 2000);
}

// ============== SOCKET EVENTS ==============

// Detect which piece moved between old and new board states
function detectOpponentMove(oldState, newData) {
  if (!oldState || !oldState.board || !newData.board) return null;
  if (newData.phase !== 'playing' && newData.phase !== 'gameover') return null;

  const oppColor = newData.myColor === 'red' ? 'blue' : 'red';
  const changes = [];

  for (let r = 0; r < 10; r++) {
    for (let c = 0; c < 10; c++) {
      const oldFig = oldState.board[r][c].figure;
      const newFig = newData.board[r][c].figure;

      // Track all cells where opponent figure appeared or disappeared
      if (oldFig && oldFig.color === oppColor && (!newFig || newFig.color !== oppColor)) {
        changes.push({ type: 'disappeared', row: r, col: c, figure: oldFig });
      }
      if (newFig && newFig.color === oppColor && (!oldFig || oldFig.color !== oppColor || oldFig.key !== newFig.key)) {
        changes.push({ type: 'appeared', row: r, col: c, figure: newFig });
      }
    }
  }

  // Find a disappeared and appeared pair (normal move or combat win)
  const disappeared = changes.filter(c => c.type === 'disappeared');
  const appeared = changes.filter(c => c.type === 'appeared');

  if (disappeared.length === 1 && appeared.length === 1) {
    // Simple move or attacker wins
    return { 
      fromRow: disappeared[0].row, 
      fromCol: disappeared[0].col, 
      toRow: appeared[0].row, 
      toCol: appeared[0].col 
    };
  }

  if (disappeared.length === 1 && appeared.length === 0) {
    // Opponent attacked and lost (or both died)
    // Find where they attacked by looking for the nearest cell where our piece exists or was
    const from = disappeared[0];
    
    // Check all 4 adjacent cells first (most common case)
    const adjacentCells = [
      [from.row - 1, from.col], // up
      [from.row + 1, from.col], // down
      [from.row, from.col - 1], // left
      [from.row, from.col + 1], // right
    ];
    
    for (const [r, c] of adjacentCells) {
      if (r >= 0 && r < 10 && c >= 0 && c < 10) {
        const oldFig = oldState.board[r][c].figure;
        const newFig = newData.board[r][c].figure;
        
        // Check if our piece is still there (we won) or disappeared (both died)
        if (oldFig && oldFig.color === newData.myColor) {
          return { fromRow: from.row, fromCol: from.col, toRow: r, toCol: c };
        }
      }
    }
    
    // If not adjacent, check for scout long-range moves (same row or column)
    for (let r = 0; r < 10; r++) {
      for (let c = 0; c < 10; c++) {
        if (r === from.row || c === from.col) { // same row or column
          const oldFig = oldState.board[r][c].figure;
          if (oldFig && oldFig.color === newData.myColor) {
            // Make sure there's a clear path (no figures between)
            let pathClear = true;
            if (r === from.row) {
              // Horizontal movement
              const minCol = Math.min(from.col, c);
              const maxCol = Math.max(from.col, c);
              for (let checkCol = minCol + 1; checkCol < maxCol; checkCol++) {
                if (oldState.board[r][checkCol].figure) {
                  pathClear = false;
                  break;
                }
              }
            } else {
              // Vertical movement
              const minRow = Math.min(from.row, r);
              const maxRow = Math.max(from.row, r);
              for (let checkRow = minRow + 1; checkRow < maxRow; checkRow++) {
                if (oldState.board[checkRow][c].figure) {
                  pathClear = false;
                  break;
                }
              }
            }
            
            if (pathClear) {
              return { fromRow: from.row, fromCol: from.col, toRow: r, toCol: c };
            }
          }
        }
      }
    }
  }

  console.log('No move detected');
  return null;
}

function applyGameState(data) {
  const prevPhase = state ? state.phase : null;
  state = data;
  selectedCell = null;
  allowedMoves = [];

  // Clear arrow on phase change to non-playing
  if (state.phase !== 'playing' && state.phase !== 'gameover') {
    oppLastMove = null;
    revealedFigures.clear();
  }

  // Play bell sound when game starts (both players ready)
  if (state.phase === 'playing' && prevPhase === 'placement') {
    sounds.bell.currentTime = 0;
    sounds.bell.play().catch(() => {});
  }

  // Track when gameover first occurs for reset countdown
  if (state.phase === 'gameover' && prevPhase !== 'gameover') {
    gameoverTimestamp = Date.now();
  } else if (state.phase !== 'gameover') {
    gameoverTimestamp = null;
    stopCountdown();
  }

  // Auto-deselect figure if depleted
  if (state.phase === 'placement' && selectedFigure) {
    const remaining = state.remaining || {};
    if (!remaining[selectedFigure] || remaining[selectedFigure] <= 0) {
      selectedFigure = null;
    }
  }

  drawBoard();
  updateSidebar();
  updateStatusBar();
}

let pendingCombatData = null;

socket.on('game_state', (data) => {
  const oldState = state;
  const prevTurn = state ? state.turn : null;
  const isMyTurnNow = data.turn === data.myColor;
  const wasMyTurn = prevTurn === data.myColor;

  // Detect opponent's move: turn changed from opponent to me
  const oppMoved = oldState && 
    oldState.board &&
    data.phase !== 'placement' && 
    data.phase !== 'waiting' &&
    prevTurn !== null &&
    !wasMyTurn && 
    isMyTurnNow;

  if (oppMoved) {
    const oppMove = detectOpponentMove(oldState, data);
    if (oppMove) {
      oppLastMove = oppMove; // store opponent's move arrow (shown in orange)

      // Get the figure to animate (from old state)
      const oldFig = oldState.board[oppMove.fromRow][oppMove.fromCol].figure;
      if (oldFig) {
        const [fdr, fdc] = toDisplay(oppMove.fromRow, oppMove.fromCol);
        const [tdr, tdc] = toDisplay(oppMove.toRow, oppMove.toCol);
        moveAnimation = {
          figure: oldFig,
          fromX: fdc * CELL,
          fromY: fdr * CELL,
          toX: tdc * CELL,
          toY: tdr * CELL,
          startTime: Date.now(),
          duration: ANIM_DURATION,
          logicalFrom: [oppMove.fromRow, oppMove.fromCol],
          logicalTo: [oppMove.toRow, oppMove.toCol],
          pendingState: data,
          pendingCombat: pendingCombatData,
        };
        pendingCombatData = null;
        // Apply state immediately but animation will handle the visual
        state = data;
        selectedCell = null;
        allowedMoves = [];

        // Play bell sound when game starts
        const prevPhase = oldState ? oldState.phase : null;
        if (state.phase === 'playing' && prevPhase === 'placement') {
          sounds.bell.currentTime = 0;
          sounds.bell.play().catch(() => {});
        }
        if (state.phase === 'gameover' && prevPhase !== 'gameover') {
          gameoverTimestamp = Date.now();
        } else if (state.phase !== 'gameover') {
          gameoverTimestamp = null;
          stopCountdown();
        }

        updateSidebar();
        updateStatusBar();
        drawBoard(); // starts animation loop
        return;
      }
    }
  }

  // If it's my own move coming back, or no animation needed
  if (moveAnimation) {
    // Animation in progress (my move) - queue the state update
    moveAnimation.pendingState = data;
    if (pendingCombatData) {
      moveAnimation.pendingCombat = pendingCombatData;
      pendingCombatData = null;
    }
    return;
  }

  applyGameState(data);
});

socket.on('allowed_moves', (data) => {
  allowedMoves = data.moves;
  drawBoard();
});

socket.on('combat_result', (data) => {
  console.log('combat_result received:', data);
  console.log('state.myColor:', state?.myColor);
  
  // Check if opponent's figure killed mine (defender wins and defender is opponent)
  if (state && data.result === 'defender_wins' && data.defender.color !== state.myColor) {
    // Reveal the opponent's figure at toRow, toCol (where the defender stayed)
    const key = `${data.toRow},${data.toCol}`;
    revealedFigures.set(key, data.defender.key); // Store the actual figure key
    console.log('Revealing opponent figure at', data.toRow, data.toCol, '- key:', key, 'figure:', data.defender.key);
    console.log('revealedFigures now has:', Array.from(revealedFigures.entries()));
  }
  
  if (moveAnimation) {
    // Queue combat for after animation
    pendingCombatData = data;
  } else {
    playCombatSound(data);
    showCombatOverlay(data);
  }
});

socket.on('game_reset', () => {
  window.location.reload();
});

socket.on('rejected', (data) => {
  document.getElementById('status-text').textContent = data.reason || t('gameIsFull');
  document.getElementById('gameCanvas').style.opacity = '0.5';
  document.getElementById('gameCanvas').style.pointerEvents = 'none';
});

socket.on('disconnect', () => {
  document.getElementById('status-text').textContent = t('disconnectedFromServer');
});

// Initial setup
drawBoard();
// Apply saved language on load
document.getElementById('lang-en').className = currentLang === 'en' ? 'active' : '';
document.getElementById('lang-ua').className = currentLang === 'ua' ? 'active' : '';
document.getElementById('status-text').textContent = t('connecting');
updateStaticLabels();
</script>
</body>
</html>
